<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <rect x="45" y="45" width="1110" height="530" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1100" y="95" text-anchor="end" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">المستخدمون والصلاحيات</text>
  <text x="1100" y="132" text-anchor="end" font-family="Arial, sans-serif" font-size="19" fill="#475569">المدير الرئيسي يملك كل الصلاحيات — العامل يرى فقط ما يتم السماح به</text>

  <rect x="650" y="175" width="450" height="330" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="1035" cy="235" r="34" fill="#2563eb"/>
  <text x="1035" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#fff">✓</text>
  <text x="975" y="225" text-anchor="end" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">المدير الرئيسي</text>
  <text x="975" y="258" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#334155">كل الصلاحيات تلقائياً</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#0f172a">
    <text x="1035" y="320" text-anchor="end">✓ الطلاب والتسجيل</text>
    <text x="1035" y="360" text-anchor="end">✓ المالية والرواتب</text>
    <text x="1035" y="400" text-anchor="end">✓ التقارير</text>
    <text x="1035" y="440" text-anchor="end">✓ المستخدمون والنسخ الاحتياطية</text>
    <text x="1035" y="480" text-anchor="end">✓ مسح بيانات التشغيل</text>
  </g>

  <rect x="100" y="175" width="470" height="330" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="510" y="225" text-anchor="end" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">عامل</text>
  <text x="510" y="258" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#475569">حدد صلاحياته واحدة واحدة</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#0f172a">
    <rect x="470" y="298" width="22" height="22" rx="4" fill="#16a34a"/><text x="455" y="316" text-anchor="end">مشاهدة الطلاب</text>
    <rect x="470" y="338" width="22" height="22" rx="4" fill="#16a34a"/><text x="455" y="356" text-anchor="end">تسجيل قبض</text>
    <rect x="470" y="378" width="22" height="22" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="455" y="396" text-anchor="end">التقارير</text>
    <rect x="470" y="418" width="22" height="22" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="455" y="436" text-anchor="end">إدارة المستخدمين</text>
    <rect x="470" y="458" width="22" height="22" rx="4" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="455" y="476" text-anchor="end" fill="#b91c1c">مسح بيانات التشغيل</text>
  </g>

  <rect x="100" y="525" width="1000" height="34" rx="10" fill="#fef2f2"/>
  <text x="1080" y="548" text-anchor="end" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">الصلاحيات الخطيرة مغلقة افتراضياً، وأي صفحة غير مسموحة لا تظهر للعامل.</text>
</svg>
