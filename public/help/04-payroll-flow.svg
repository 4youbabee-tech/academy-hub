<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">دفع راتب الموظف بالشهور</title>
  <desc id="desc">كل شهر يظهر مع مربع اختيار ومبلغ قابل للتعديل في السطر نفسه</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#173f47" flood-opacity=".13"/></filter>
    <style>text{font-family:"Segoe UI",Tahoma,Arial,sans-serif}text:not([fill]){fill:#263c42}.small{font-size:14px;fill:#6b7d80}.head{font-size:18px;font-weight:800}</style>
  </defs>
  <rect width="900" height="430" rx="24" fill="#f7f8f4"/>
  <text x="450" y="46" text-anchor="middle" font-size="25" font-weight="800">دفع مستحقات الموظف بدون لخبطة</text>
  <text x="450" y="75" text-anchor="middle" class="small">✓ اختر الشهر، ثم عدّل مبلغ نفس السطر إذا كانت الدفعة جزئية</text>

  <g filter="url(#shadow)">
    <rect x="72" y="105" width="756" height="235" rx="20" fill="white" stroke="#d9e4e1"/>

    <rect x="105" y="140" width="690" height="72" rx="14" fill="#f9fbfa" stroke="#d9e4e1"/>
    <rect x="742" y="164" width="24" height="24" rx="5" fill="#48966b"/>
    <path d="M748 176l5 5 9-11" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="710" y="164" text-anchor="end" class="head">متبقي من راتب شهر 8 / 2026</text>
    <text x="710" y="190" text-anchor="end" class="small">المتبقي 50 USD</text>
    <rect x="135" y="158" width="150" height="36" rx="8" fill="white" stroke="#d9e4e1"/>
    <text x="210" y="181" text-anchor="middle" font-size="14" font-weight="800">50</text>

    <rect x="105" y="230" width="690" height="72" rx="14" fill="#f9fbfa" stroke="#d9e4e1"/>
    <rect x="742" y="254" width="24" height="24" rx="5" fill="white" stroke="#91a3a6" stroke-width="2"/>
    <text x="710" y="254" text-anchor="end" class="head">راتب شهر 9 / 2026</text>
    <text x="710" y="280" text-anchor="end" class="small">المتبقي 400 USD</text>
    <rect x="135" y="248" width="150" height="36" rx="8" fill="white" stroke="#d9e4e1"/>
    <text x="210" y="271" text-anchor="middle" class="small">المبلغ</text>
  </g>

  <rect x="160" y="370" width="580" height="34" rx="9" fill="#e9f4f3"/>
  <text x="450" y="392" text-anchor="middle" font-size="14" font-weight="700">الـ Checkbox والمبلغ اليدوي موجودان معًا في نفس سطر الشهر</text>
</svg>
