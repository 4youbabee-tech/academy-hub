<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">إعداد Academy Hub لأول مرة</title>
  <desc id="desc">تسجيل الدخول ثم الإعدادات والمستخدمون والنسخ الاحتياطي ومسح بيانات التجربة الآمن</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#173f47" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3e7f85"/></marker>
    <style>text{font-family:"Segoe UI",Tahoma,Arial,sans-serif}text:not([fill]){fill:#263c42}.small{font-size:15px;fill:#6b7d80}.label{font-size:18px;font-weight:700}.num{font-size:18px;font-weight:800;fill:white!important}</style>
  </defs>
  <rect width="900" height="430" rx="24" fill="#f7f8f4"/>
  <text x="450" y="48" text-anchor="middle" font-size="25" font-weight="800">إعداد البرنامج قبل إدخال البيانات الحقيقية</text>
  <text x="450" y="76" text-anchor="middle" class="small">نفّذ الخطوات الأربع بالترتيب من اليمين إلى اليسار</text>

  <g filter="url(#shadow)">
    <rect x="60" y="105" width="780" height="260" rx="20" fill="white" stroke="#d9e4e1"/>
    <rect x="660" y="105" width="180" height="260" rx="20" fill="#284f57"/>
    <rect x="678" y="130" width="144" height="44" rx="10" fill="#396b73"/>
    <text x="750" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="white">Academy Hub</text>
    <text x="750" y="205" text-anchor="middle" font-size="15" fill="#e5f2f1">لوحة المعلومات</text>
    <text x="750" y="239" text-anchor="middle" font-size="15" fill="#e5f2f1">الإعدادات</text>
    <text x="750" y="273" text-anchor="middle" font-size="15" fill="#e5f2f1">المستخدمون</text>
    <text x="750" y="307" text-anchor="middle" font-size="15" fill="#e5f2f1">النسخ / مسح التجربة</text>

    <rect x="90" y="132" width="530" height="62" rx="13" fill="#eef6f5"/>
    <text x="590" y="157" text-anchor="end" class="label">بيانات المعهد</text>
    <text x="590" y="180" text-anchor="end" class="small">الاسم · الشعار · العملة · السنة الدراسية</text>
    <rect x="90" y="216" width="250" height="112" rx="14" fill="#fffaf0" stroke="#f0d7a2"/>
    <text x="315" y="247" text-anchor="end" class="label">نسخة احتياطية</text>
    <path d="M160 258h58a13 13 0 0 1 13 13v28a13 13 0 0 1-13 13h-58a13 13 0 0 1-13-13v-28a13 13 0 0 1 13-13z" fill="#d99d3d"/>
    <path d="M168 277h42M168 292h32" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <rect x="370" y="216" width="250" height="112" rx="14" fill="#f2f7fb" stroke="#cbdde8"/>
    <text x="595" y="247" text-anchor="end" class="label">حسابات العاملين</text>
    <circle cx="430" cy="281" r="20" fill="#4d8790"/><circle cx="475" cy="281" r="20" fill="#76a6ad"/><path d="M407 315c5-20 42-20 47 0M452 315c5-20 42-20 47 0" fill="#4d8790" opacity=".8"/>
  </g>

  <g>
    <line x1="715" y1="398" x2="575" y2="398" stroke="#3e7f85" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="520" y1="398" x2="380" y2="398" stroke="#3e7f85" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="325" y1="398" x2="185" y2="398" stroke="#3e7f85" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="750" cy="398" r="20" fill="#3e7f85"/><text x="750" y="405" text-anchor="middle" class="num">1</text>
    <circle cx="555" cy="398" r="20" fill="#3e7f85"/><text x="555" y="405" text-anchor="middle" class="num">2</text>
    <circle cx="360" cy="398" r="20" fill="#3e7f85"/><text x="360" y="405" text-anchor="middle" class="num">3</text>
    <circle cx="165" cy="398" r="20" fill="#d99d3d"/><text x="165" y="405" text-anchor="middle" class="num">4</text>
  </g>
</svg>
