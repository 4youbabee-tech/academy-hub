<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">حماية النظام والنسخ الاحتياطي المشفر</title>
  <desc id="desc">المستخدمون والصلاحيات وسجل التدقيق ونسخ يدوية ويومية مشفرة + صلاحيات وتدقيق</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#173f47" flood-opacity=".13"/></filter>
    <style>text{font-family:"Segoe UI",Tahoma,Arial,sans-serif}text:not([fill]){fill:#263c42}.small{font-size:14px;fill:#6b7d80}.head{font-size:18px;font-weight:800}</style>
  </defs>
  <rect width="900" height="430" rx="24" fill="#f7f8f4"/>
  <text x="450" y="47" text-anchor="middle" font-size="25" font-weight="800">ثلاث طبقات لحماية بيانات المركز</text>
  <text x="450" y="76" text-anchor="middle" class="small">صلاحيات واضحة + سجل تدقيق + نسخة مشفرة قابلة للنقل والاستعادة</text>

  <g filter="url(#shadow)">
    <rect x="603" y="108" width="245" height="245" rx="20" fill="white" stroke="#d9e4e1"/>
    <circle cx="726" cy="162" r="34" fill="#e8f3f2"/><path d="M726 130l28 10v22c0 21-12 34-28 43-16-9-28-22-28-43v-22z" fill="#3e7f85"/><path d="M714 163l9 9 17-21" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <text x="726" y="231" text-anchor="middle" class="head">المستخدمون والصلاحيات</text>
    <text x="726" y="258" text-anchor="middle" class="small">حساب مستقل لكل موظف</text>
    <rect x="635" y="286" width="182" height="42" rx="10" fill="#eef6f5"/><text x="726" y="312" text-anchor="middle" font-size="14" font-weight="700">المالك · المدير · المحاسب</text>

    <rect x="328" y="108" width="245" height="245" rx="20" fill="white" stroke="#d9e4e1"/>
    <circle cx="451" cy="162" r="34" fill="#fff4df"/><path d="M432 141h38v45h-38z" fill="#d99d3d"/><path d="M441 151h20M441 162h20M441 173h14" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <text x="451" y="231" text-anchor="middle" class="head">سجل التدقيق</text>
    <text x="451" y="258" text-anchor="middle" class="small">من فعل ماذا ومتى؟</text>
    <rect x="360" y="286" width="182" height="42" rx="10" fill="#fff8e8"/><text x="451" y="312" text-anchor="middle" font-size="14" font-weight="700">إضافة · تعديل · إلغاء</text>

    <rect x="53" y="108" width="245" height="245" rx="20" fill="white" stroke="#d9e4e1"/>
    <circle cx="176" cy="162" r="34" fill="#eaf5ee"/><rect x="155" y="151" width="42" height="32" rx="6" fill="#48966b"/><path d="M164 151v-8a12 12 0 0 1 24 0v8" fill="none" stroke="#48966b" stroke-width="6"/><circle cx="176" cy="166" r="4" fill="white"/><path d="M176 170v7" stroke="white" stroke-width="3"/>
    <text x="176" y="231" text-anchor="middle" class="head">Backup مشفر</text>
    <text x="176" y="258" text-anchor="middle" class="small">يدوي محمول + يومي محلي مشفر</text>
    <rect x="75" y="286" width="202" height="42" rx="10" fill="#edf8f1"/><text x="176" y="305" text-anchor="middle" font-size="13" font-weight="700">يدوي للنقل · يومي للاستعادة</text><text x="176" y="321" text-anchor="middle" font-size="11">اليومي لنفس الجهاز · اليدوي للنقل</text>
  </g>

  <rect x="115" y="378" width="670" height="35" rx="9" fill="#284f57"/><text x="450" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="white">احفظ ملف النسخة وكلمة الحماية في مكانين منفصلين — بدون كلمة الحماية لا يمكن فك النسخة</text>
</svg>
