<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">قبض دفعة الطالب حسب الأشهر</title>
  <desc id="desc">كل شهر يظهر مع مربع اختيار ومبلغ قابل للتعديل في السطر نفسه</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#173f47" flood-opacity=".13"/></filter>
    <style>text{font-family:"Segoe UI",Tahoma,Arial,sans-serif}text:not([fill]){fill:#263c42}.small{font-size:14px;fill:#6b7d80}.head{font-size:17px;font-weight:800}</style>
  </defs>
  <rect width="900" height="430" rx="24" fill="#f7f8f4"/>
  <text x="450" y="46" text-anchor="middle" font-size="25" font-weight="800">قبض دفعة الطالب بدون لخبطة</text>
  <text x="450" y="74" text-anchor="middle" class="small">✓ اختر الشهر، ويظهر كامل المتبقي تلقائيًا ويمكن تعديل المبلغ في نفس السطر</text>

  <g filter="url(#shadow)">
    <rect x="80" y="105" width="740" height="250" rx="20" fill="white" stroke="#d9e4e1"/>
    <text x="780" y="138" text-anchor="end" class="head">الفاتورة INV-00001 — الطالب: هادي</text>
    <text x="780" y="164" text-anchor="end" class="small">إجمالي المستحق 80 USD — المتبقي الكلي 60 USD</text>

    <rect x="110" y="188" width="680" height="66" rx="14" fill="#f9fbfa" stroke="#d9e4e1"/>
    <rect x="742" y="209" width="24" height="24" rx="5" fill="#48966b"/>
    <path d="M748 221l5 5 9-11" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="710" y="214" text-anchor="end" class="head">متبقي من شهر 8 / 2026</text>
    <text x="710" y="238" text-anchor="end" class="small">المتبقي 20 USD</text>
    <rect x="145" y="205" width="150" height="34" rx="8" fill="white" stroke="#d9e4e1"/>
    <text x="220" y="227" text-anchor="middle" font-size="14" font-weight="800">20</text>

    <rect x="110" y="267" width="680" height="66" rx="14" fill="#f9fbfa" stroke="#d9e4e1"/>
    <rect x="742" y="288" width="24" height="24" rx="5" fill="white" stroke="#91a3a6" stroke-width="2"/>
    <text x="710" y="293" text-anchor="end" class="head">شهر 9 / 2026</text>
    <text x="710" y="317" text-anchor="end" class="small">المتبقي 40 USD</text>
    <rect x="145" y="284" width="150" height="34" rx="8" fill="white" stroke="#d9e4e1"/>
    <text x="220" y="306" text-anchor="middle" class="small">المبلغ</text>
  </g>

  <rect x="175" y="378" width="550" height="32" rx="9" fill="#e9f4f3"/>
  <text x="450" y="399" text-anchor="middle" font-size="14" font-weight="700">لا يوجد «توزيع بالأقدم أولًا» ولا خانة مبلغ ثانية منفصلة</text>
</svg>
