<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">إنشاء سند قبض</title>
  <desc id="desc">اختيار فاتورة الطالب وإدخال المبلغ والبيان ثم الحفظ والطباعة</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#173f47" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10z" fill="#d99d3d"/></marker>
    <style>text{font-family:"Segoe UI",Tahoma,Arial,sans-serif}text:not([fill]){fill:#263c42}.small{font-size:14px;fill:#6b7d80}.head{font-size:17px;font-weight:800}</style>
  </defs>
  <rect width="900" height="430" rx="24" fill="#f7f8f4"/>
  <text x="450" y="46" text-anchor="middle" font-size="25" font-weight="800">قبض دفعة من الطالب بدون تكرار الحساب</text>
  <text x="450" y="74" text-anchor="middle" class="small">كل دفعة طالب تُسجل من الإيصالات والفواتير فقط</text>

  <g filter="url(#shadow)">
    <rect x="475" y="102" width="380" height="270" rx="18" fill="white" stroke="#d9e4e1"/>
    <rect x="475" y="102" width="380" height="52" rx="18" fill="#284f57"/><rect x="475" y="136" width="380" height="18" fill="#284f57"/>
    <text x="825" y="134" text-anchor="end" font-size="18" font-weight="800" fill="white">الإيصالات والفواتير</text>
    <rect x="500" y="174" width="330" height="38" rx="9" fill="#f3f6f5" stroke="#d9e4e1"/><text x="812" y="198" text-anchor="end" class="small">ابحث باسم الطالب...</text>
    <rect x="500" y="229" width="330" height="95" rx="10" fill="#fbfcfa" stroke="#d9e4e1"/>
    <text x="812" y="255" text-anchor="end" class="head">سامر أحمد — دورة اللغة</text>
    <text x="812" y="282" text-anchor="end" class="small">المستحق 320</text><text x="680" y="282" text-anchor="end" class="small">المقبوض 120</text><text x="552" y="282" text-anchor="end" font-size="14" font-weight="800" fill="#b77418">المتبقي 200</text>
    <rect x="684" y="334" width="146" height="28" rx="8" fill="#3e7f85"/><text x="757" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="white">سند قبض جديد</text>

    <rect x="45" y="102" width="360" height="270" rx="18" fill="white" stroke="#d9e4e1"/>
    <text x="375" y="136" text-anchor="end" class="head">سند قبض جديد</text>
    <text x="375" y="171" text-anchor="end" class="small">الطالب / الفاتورة</text><rect x="70" y="180" width="305" height="31" rx="7" fill="#f3f6f5" stroke="#d9e4e1"/><text x="360" y="201" text-anchor="end" font-size="13">سامر أحمد — المتبقي 200</text>
    <text x="375" y="238" text-anchor="end" class="small">مبلغ هذه الدفعة</text><rect x="230" y="247" width="145" height="31" rx="7" fill="#fffaf0" stroke="#d99d3d"/><text x="360" y="268" text-anchor="end" font-size="14" font-weight="800">100</text>
    <text x="205" y="238" text-anchor="end" class="small">طريقة الدفع</text><rect x="70" y="247" width="135" height="31" rx="7" fill="#f3f6f5" stroke="#d9e4e1"/><text x="190" y="268" text-anchor="end" font-size="13">نقدي</text>
    <text x="375" y="305" text-anchor="end" class="small">البيان: دفعة أولى</text>
    <rect x="70" y="326" width="305" height="34" rx="8" fill="#48966b"/><text x="222" y="349" text-anchor="middle" font-size="14" font-weight="800" fill="white">حفظ السند وطباعته</text>
  </g>
  <line x1="458" y1="235" x2="425" y2="235" stroke="#d99d3d" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="244" y="391" width="412" height="28" rx="8" fill="#eaf5ee"/><text x="450" y="411" text-anchor="middle" font-size="14" font-weight="700" fill="#397b57">بعد الحفظ: المقبوض 220 · المتبقي 100</text>
</svg>
