name: Remediate audited dependencies

on:
  push:
    branches:
      - academy-v1.1.0-upgrade

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message != 'chore: remediate audited dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: academy-v1.1.0-upgrade

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply audit lockfile fixes only
        run: npm audit fix --package-lock-only

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit deterministic lockfile remediation
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: remediate audited dependencies"
          git push origin HEAD:academy-v1.1.0-upgrade
