name: Apply secure backup hardening

on:
  push:
    branches: [academy-v1.1.1-final-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: academy-v1.1.1-final-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply encrypted backup and database hardening
        shell: bash
        run: |
          cat > /tmp/apply-hardening.py <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          Path("desktop/backup-crypto.mjs").write_text(r'''import { createCipheriv, createDecipheriv, randomBytes, scryptSync } from "node:crypto";
          import { open, readFile, writeFile } from "node:fs/promises";

          const PORTABLE_MAGIC = Buffer.from("AHPB1", "ascii");
          const DEVICE_MAGIC = Buffer.from("AHDB1", "ascii");
          const SALT_BYTES = 16;
          const IV_BYTES = 12;
          const TAG_BYTES = 16;

          function assertKey(key) {
            if (!Buffer.isBuffer(key) || key.length !== 32) throw new Error("Invalid Academy Hub encryption key.");
          }

          function passphraseKey(password, salt) {
            if (typeof password !== "string" || password.length < 10 || password.length > 256) {
              throw new Error("كلمة مرور النسخة الاحتياطية يجب أن تكون 10 أحرف على الأقل.");
            }
            return scryptSync(password, salt, 32, { N: 16384, r: 8, p: 1 });
          }

          async function header(filePath) {
            const handle = await open(filePath, "r");
            try {
              const value = Buffer.alloc(5);
              const { bytesRead } = await handle.read(value, 0, 5, 0);
              return bytesRead === 5 ? value : Buffer.alloc(0);
            } finally {
              await handle.close();
            }
          }

          export async function encryptedBackupKind(filePath) {
            const value = await header(filePath);
            if (value.equals(PORTABLE_MAGIC)) return "portable";
            if (value.equals(DEVICE_MAGIC)) return "device";
            return "plain";
          }

          function encryptBuffer(plain, key, magic, prefix = Buffer.alloc(0)) {
            assertKey(key);
            const iv = randomBytes(IV_BYTES);
            const cipher = createCipheriv("aes-256-gcm", key, iv);
            const encrypted = Buffer.concat([cipher.update(plain), cipher.final()]);
            return Buffer.concat([magic, prefix, iv, cipher.getAuthTag(), encrypted]);
          }

          function decryptBuffer(payload, key, offset) {
            assertKey(key);
            const iv = payload.subarray(offset, offset + IV_BYTES);
            const tag = payload.subarray(offset + IV_BYTES, offset + IV_BYTES + TAG_BYTES);
            const encrypted = payload.subarray(offset + IV_BYTES + TAG_BYTES);
            try {
              const decipher = createDecipheriv("aes-256-gcm", key, iv);
              decipher.setAuthTag(tag);
              return Buffer.concat([decipher.update(encrypted), decipher.final()]);
            } catch {
              throw new Error("تعذر فك النسخة الاحتياطية: كلمة المرور غير صحيحة أو الملف تالف.");
            }
          }

          export async function encryptPortableBackup(source, destination, password) {
            const plain = await readFile(source);
            const salt = randomBytes(SALT_BYTES);
            const key = passphraseKey(password, salt);
            await writeFile(destination, encryptBuffer(plain, key, PORTABLE_MAGIC, salt), { mode: 0o600 });
          }

          export async function decryptPortableBackup(source, destination, password) {
            const payload = await readFile(source);
            if (!payload.subarray(0, 5).equals(PORTABLE_MAGIC)) throw new Error("هذه ليست نسخة احتياطية محمولة مشفرة.");
            if (payload.length <= 5 + SALT_BYTES + IV_BYTES + TAG_BYTES) throw new Error("ملف النسخة الاحتياطية المشفرة تالف.");
            const salt = payload.subarray(5, 5 + SALT_BYTES);
            const key = passphraseKey(password, salt);
            await writeFile(destination, decryptBuffer(payload, key, 5 + SALT_BYTES), { mode: 0o600 });
          }

          export async function encryptDeviceBackup(source, destination, key) {
            const plain = await readFile(source);
            await writeFile(destination, encryptBuffer(plain, key, DEVICE_MAGIC), { mode: 0o600 });
          }

          export async function decryptDeviceBackup(source, destination, key) {
            const payload = await readFile(source);
            if (!payload.subarray(0, 5).equals(DEVICE_MAGIC)) throw new Error("هذه ليست نسخة احتياطية داخلية مشفرة.");
            if (payload.length <= 5 + IV_BYTES + TAG_BYTES) throw new Error("ملف النسخة الاحتياطية المشفرة تالف.");
            await writeFile(destination, decryptBuffer(payload, key, 5), { mode: 0o600 });
          }
          ''')

          replace("desktop/database.mjs",
                  'import { backup as sqliteBackup, DatabaseSync } from "node:sqlite";\nimport { mkdir, copyFile, readdir, rm, stat } from "node:fs/promises";\nimport path from "node:path";',
                  'import { backup as sqliteBackup, DatabaseSync } from "node:sqlite";\nimport { randomUUID } from "node:crypto";\nimport { mkdir, copyFile, readdir, rm, stat } from "node:fs/promises";\nimport path from "node:path";\nimport { decryptDeviceBackup, decryptPortableBackup, encryptedBackupKind, encryptDeviceBackup, encryptPortableBackup } from "./backup-crypto.mjs";')
          replace("desktop/database.mjs", '  static async open({ databasePath, backupDirectory }) {', '  static async open({ databasePath, backupDirectory, deviceBackupKey = null }) {')
          replace("desktop/database.mjs", '    const instance = new AcademyDatabase(databasePath, backupDirectory);', '    const instance = new AcademyDatabase(databasePath, backupDirectory, deviceBackupKey);')
          replace("desktop/database.mjs",
                  '  constructor(databasePath, backupDirectory) {\n    this.databasePath = databasePath;\n    this.backupDirectory = backupDirectory;\n    this.db = new DatabaseSync(databasePath);\n  }',
                  '  constructor(databasePath, backupDirectory, deviceBackupKey = null) {\n    this.databasePath = databasePath;\n    this.backupDirectory = backupDirectory;\n    this.deviceBackupKey = Buffer.isBuffer(deviceBackupKey) && deviceBackupKey.length === 32 ? deviceBackupKey : null;\n    this.db = new DatabaseSync(databasePath);\n  }')
          replace("desktop/database.mjs", '    this.runMigrations(currentVersion);\n  }', '''    this.runMigrations(currentVersion);
            this.ensurePerformanceIndexes();
          }

          ensurePerformanceIndexes() {
            this.db.exec(`
              CREATE INDEX IF NOT EXISTS idx_entities_student_date ON entities(collection, student_id, date_key);
              CREATE INDEX IF NOT EXISTS idx_entities_employee_date ON entities(collection, employee_id, date_key);
              CREATE INDEX IF NOT EXISTS idx_entities_collection_void_date ON entities(collection, is_void, date_key);
            `);
          }''')

          start = '''  async createBackup(destination) {
            await mkdir(path.dirname(destination), { recursive: true });
            await rm(destination, { force: true });
            await sqliteBackup(this.db, destination);
            return destination;
          }
          '''
          new = '''  async createBackup(destination, { password = null, portable = false } = {}) {
            await mkdir(path.dirname(destination), { recursive: true });
            await rm(destination, { force: true });
            const shouldEncrypt = portable || Boolean(this.deviceBackupKey);
            if (!shouldEncrypt) {
              await sqliteBackup(this.db, destination);
              return destination;
            }

            const temporary = path.join(this.backupDirectory, `.academy-hub-plain-${randomUUID()}.sqlite`);
            try {
              await sqliteBackup(this.db, temporary);
              if (portable) {
                await encryptPortableBackup(temporary, destination, password);
              } else {
                await encryptDeviceBackup(temporary, destination, this.deviceBackupKey);
              }
            } finally {
              await rm(temporary, { force: true });
            }
            return destination;
          }

          async materializeBackup(source, { password = null } = {}) {
            const kind = await encryptedBackupKind(source);
            if (kind === "plain") return { path: source, temporary: false, kind };
            const temporary = path.join(this.backupDirectory, `.academy-hub-decrypted-${randomUUID()}.sqlite`);
            try {
              if (kind === "portable") {
                await decryptPortableBackup(source, temporary, password);
              } else {
                if (!this.deviceBackupKey) throw new Error("هذه نسخة داخلية مشفرة مرتبطة بالجهاز الذي أنشأها.");
                await decryptDeviceBackup(source, temporary, this.deviceBackupKey);
              }
              return { path: temporary, temporary: true, kind };
            } catch (error) {
              await rm(temporary, { force: true });
              throw error;
            }
          }
          '''
          replace("desktop/database.mjs", start, new)
          replace("desktop/database.mjs", '`academy-hub-auto-${localFileTimestamp()}.sqlite`,', '`academy-hub-auto-${localFileTimestamp()}.${this.deviceBackupKey ? "ahbackup" : "sqlite"}`,')
          replace("desktop/database.mjs", '/^academy-hub-auto-.*\\.sqlite$/i.test(entry.name)', '/^academy-hub-auto-.*\\.(?:ahbackup|sqlite)$/i.test(entry.name)')

          old_validate_start = '  async validateBackup(source) {\n    const info = await stat(source);\n    if (!info.isFile() || info.size < 512) throw new Error("ملف النسخة الاحتياطية غير صالح.");\n    const candidate = new DatabaseSync(source, { readOnly: true });'
          new_validate_start = '  async validatePlainBackup(source) {\n    const info = await stat(source);\n    if (!info.isFile() || info.size < 512) throw new Error("ملف النسخة الاحتياطية غير صالح.");\n    const candidate = new DatabaseSync(source, { readOnly: true });'
          replace("desktop/database.mjs", old_validate_start, new_validate_start)
          marker = '''  async restoreFrom(source) {
            await this.validateBackup(source);
          '''
          wrapper = '''  async validateBackup(source, { password = null } = {}) {
            const materialized = await this.materializeBackup(source, { password });
            try {
              await this.validatePlainBackup(materialized.path);
              return { kind: materialized.kind };
            } finally {
              if (materialized.temporary) await rm(materialized.path, { force: true });
            }
          }

          async restoreFrom(source, { password = null } = {}) {
            const materialized = await this.materializeBackup(source, { password });
            try {
              await this.validatePlainBackup(materialized.path);
          '''
          replace("desktop/database.mjs", marker, wrapper)
          replace("desktop/database.mjs", '      await copyFile(source, this.databasePath);', '      await copyFile(materialized.path, this.databasePath);')
          replace("desktop/database.mjs", '''      throw error;
            }

            return safetyBackup;
          }
          ''', '''      throw error;
            } finally {
              if (materialized.temporary) await rm(materialized.path, { force: true });
            }

            return safetyBackup;
          }
          ''')
          dbp = Path("desktop/database.mjs")
          dbtxt = dbp.read_text()
          dbtxt = dbtxt.replace('`academy-hub-before-migration-v${currentVersion}-${localFileTimestamp()}.sqlite`', '`academy-hub-before-migration-v${currentVersion}-${localFileTimestamp()}.${this.deviceBackupKey ? "ahbackup" : "sqlite"}`')
          dbtxt = dbtxt.replace('`academy-hub-before-restore-${localFileTimestamp()}.sqlite`', '`academy-hub-before-restore-${localFileTimestamp()}.${this.deviceBackupKey ? "ahbackup" : "sqlite"}`')
          dbp.write_text(dbtxt)

          # Protect local automatic-backup key using Electron safeStorage/Windows DPAPI.
          replace("desktop/main.mjs", 'import { randomUUID } from "node:crypto";', 'import { randomBytes, randomUUID } from "node:crypto";')
          replace("desktop/main.mjs", 'import { unlink, writeFile } from "node:fs/promises";', 'import { mkdir, readFile, unlink, writeFile } from "node:fs/promises";')
          key_fn = r'''async function loadOrCreateDeviceBackupKey(userData) {
            const securityDirectory = path.join(userData, "security");
            const keyPath = path.join(securityDirectory, "backup-key.bin");
            await mkdir(securityDirectory, { recursive: true });
            if (!safeStorage.isEncryptionAvailable()) {
              if (app.isPackaged) throw new Error("Windows Secure Storage غير متاح، لذلك لا يمكن حماية النسخ التلقائية بأمان.");
              return null;
            }
            try {
              const protectedKey = await readFile(keyPath);
              const key = Buffer.from(safeStorage.decryptString(protectedKey), "base64");
              if (key.length !== 32) throw new Error("مفتاح حماية النسخ التلقائية غير صالح.");
              return key;
            } catch (error) {
              if (error?.code !== "ENOENT") throw error;
            }
            const key = randomBytes(32);
            await writeFile(keyPath, safeStorage.encryptString(key.toString("base64")), { mode: 0o600 });
            return key;
          }

          '''
          replace("desktop/main.mjs", 'function reserveLoopbackPort() {', key_fn + 'function reserveLoopbackPort() {')
          replace("desktop/main.mjs", 'import { AcademyDatabase } from "./database.mjs";', 'import { AcademyDatabase, ACADEMY_COLLECTIONS } from "./database.mjs";')
          validate_fn = r'''function validateSnapshotPayload(snapshot) {
            if (!snapshot || typeof snapshot !== "object" || Array.isArray(snapshot)) throw new Error("صيغة قاعدة البيانات غير صالحة.");
            if (!Number.isInteger(snapshot.schema_version) || snapshot.schema_version < 1 || snapshot.schema_version > 4) throw new Error("إصدار قاعدة البيانات غير صالح.");
            if (!snapshot.settings || typeof snapshot.settings !== "object" || Array.isArray(snapshot.settings)) throw new Error("إعدادات قاعدة البيانات غير صالحة.");
            for (const collection of ACADEMY_COLLECTIONS) {
              if (!Array.isArray(snapshot[collection])) throw new Error(`مجموعة قاعدة البيانات غير صالحة: ${collection}`);
            }
          }

          function validateBackupPassword(value, { required = false } = {}) {
            if (value == null || value === "") {
              if (required) throw new Error("أدخل كلمة مرور النسخة الاحتياطية.");
              return null;
            }
            if (typeof value !== "string" || value.length < 10 || value.length > 256) throw new Error("كلمة مرور النسخة الاحتياطية يجب أن تكون 10 أحرف على الأقل.");
            return value;
          }

          '''
          replace("desktop/main.mjs", 'function requireDatabaseAccess() {', validate_fn + 'function requireDatabaseAccess() {')
          replace("desktop/main.mjs", '''  handle("academy:database:save", (snapshot) => {
            requireDatabaseAccess();
            const payloadSize = Buffer.byteLength(JSON.stringify(snapshot), "utf8");''', '''  handle("academy:database:save", (snapshot) => {
            requireDatabaseAccess();
            validateSnapshotPayload(snapshot);
            const payloadSize = Buffer.byteLength(JSON.stringify(snapshot), "utf8");''')
          replace("desktop/main.mjs", '  handle("academy:backup:create", async () => {', '  handle("academy:backup:create", async ({ password } = {}) => {')
          replace("desktop/main.mjs", '    requireDatabaseAccess();\n    const stamp = new Date().toISOString().replace(/[:.]/g, "-");\n    const result = await dialog.showSaveDialog(mainWindow, {\n      title: "حفظ نسخة احتياطية",\n      defaultPath: path.join(app.getPath("documents"), `Academy-Hub-Backup-${stamp}.sqlite`),\n      filters: [{ name: "Academy Hub SQLite Backup", extensions: ["sqlite"] }],', '    requireDatabaseAccess();\n    const portablePassword = validateBackupPassword(password, { required: true });\n    const stamp = new Date().toISOString().replace(/[:.]/g, "-");\n    const result = await dialog.showSaveDialog(mainWindow, {\n      title: "حفظ نسخة احتياطية مشفرة",\n      defaultPath: path.join(app.getPath("documents"), `Academy-Hub-Backup-${stamp}.ahbackup`),\n      filters: [{ name: "Academy Hub Encrypted Backup", extensions: ["ahbackup"] }],')
          replace("desktop/main.mjs", '    await database.createBackup(result.filePath);', '    await database.createBackup(result.filePath, { password: portablePassword, portable: true });')
          replace("desktop/main.mjs", '  handle("academy:backup:restore", async () => {', '  handle("academy:backup:restore", async ({ password } = {}) => {')
          replace("desktop/main.mjs", '      filters: [{ name: "Academy Hub SQLite Backup", extensions: ["sqlite", "db"] }],', '      filters: [{ name: "Academy Hub Backup", extensions: ["ahbackup", "sqlite", "db"] }],')
          replace("desktop/main.mjs", '      const safetyBackup = await database.restoreFrom(result.filePaths[0]);', '      const safetyBackup = await database.restoreFrom(result.filePaths[0], { password: validateBackupPassword(password) });')
          replace("desktop/main.mjs", '  database = await AcademyDatabase.open({ databasePath, backupDirectory });', '  const deviceBackupKey = await loadOrCreateDeviceBackupKey(userData);\n  database = await AcademyDatabase.open({ databasePath, backupDirectory, deviceBackupKey });')

          # Preload validates password payloads before IPC.
          replace("desktop/preload.cjs", '    create: () => invoke("academy:backup:create"),\n    restore: () => invoke("academy:backup:restore"),', '''    create: (request = {}) => {
              const password = request?.password;
              if (typeof password !== "string" || password.length < 10 || password.length > 256) throw new Error("Invalid backup password.");
              return invoke("academy:backup:create", { password });
            },
            restore: (request = {}) => {
              const password = request?.password;
              if (password !== undefined && (typeof password !== "string" || password.length > 256)) throw new Error("Invalid backup password.");
              return invoke("academy:backup:restore", { password: password || null });
            },''')

          replace("src/desktop.d.ts", '    create(): Promise<{ cancelled: boolean; path?: string }>;\n    restore(): Promise<{ cancelled: boolean; restarting?: boolean; safetyBackup?: string }>;','    create(request: { password: string }): Promise<{ cancelled: boolean; path?: string }>;\n    restore(request?: { password?: string }): Promise<{ cancelled: boolean; restarting?: boolean; safetyBackup?: string }>;')

          # Desktop backup UI: require confirmation for export, allow password for encrypted restore, legacy remains supported.
          replace("src/routes/backup.tsx", 'import { Button, PageHeader, Panel } from "@/components/ui-kit";', 'import { Button, Field, Input, PageHeader, Panel } from "@/components/ui-kit";')
          replace("src/routes/backup.tsx", '  const [restoring, setRestoring] = useState(false);', '  const [restoring, setRestoring] = useState(false);\n  const [backupPassword, setBackupPassword] = useState("");\n  const [backupPasswordConfirm, setBackupPasswordConfirm] = useState("");\n  const [restorePassword, setRestorePassword] = useState("");')
          replace("src/routes/backup.tsx", '      if (desktopApi) {\n        const result = await desktopApi.backup.create();', '      if (desktopApi) {\n        if (backupPassword.length < 10) throw new Error("اختر كلمة مرور للنسخة الاحتياطية من 10 أحرف على الأقل.");\n        if (backupPassword !== backupPasswordConfirm) throw new Error("تأكيد كلمة مرور النسخة الاحتياطية غير مطابق.");\n        const result = await desktopApi.backup.create({ password: backupPassword });')
          replace("src/routes/backup.tsx", '          audit(draft, actor, "backup", null, "create", "إنشاء نسخة احتياطية SQLite لقاعدة البيانات"),', '          audit(draft, actor, "backup", null, "create", "إنشاء نسخة احتياطية مشفرة محمولة لقاعدة البيانات"),')
          replace("src/routes/backup.tsx", '      const result = await desktopApi.backup.restore();', '      const result = await desktopApi.backup.restore({ password: restorePassword || undefined });')
          replace("src/routes/backup.tsx", '''          <div className="mt-5">
            <Button onClick={exportBackup} disabled={!canExport}>
              تنزيل نسخة احتياطية
            </Button>
          </div>''', '''          {desktopApi ? (
            <div className="mt-4 grid gap-3 sm:grid-cols-2">
              <Field label="كلمة مرور النسخة المشفرة">
                <Input type="password" autoComplete="new-password" value={backupPassword} onChange={(event) => setBackupPassword(event.target.value)} placeholder="10 أحرف على الأقل" />
              </Field>
              <Field label="تأكيد كلمة المرور">
                <Input type="password" autoComplete="new-password" value={backupPasswordConfirm} onChange={(event) => setBackupPasswordConfirm(event.target.value)} />
              </Field>
            </div>
          ) : null}
          <div className="mt-5">
            <Button onClick={exportBackup} disabled={!canExport}>
              تنزيل نسخة احتياطية
            </Button>
          </div>''')
          replace("src/routes/backup.tsx", '''          <div className="mt-5">
            <Button
              variant="secondary"''', '''          {desktopApi ? (
            <div className="mt-4">
              <Field label="كلمة مرور النسخة (اتركها فارغة فقط للنسخ القديمة SQLite)">
                <Input type="password" autoComplete="current-password" value={restorePassword} onChange={(event) => setRestorePassword(event.target.value)} />
              </Field>
            </div>
          ) : null}
          <div className="mt-5">
            <Button
              variant="secondary"''')
          replace("src/routes/backup.tsx", '              ? "يتم حفظ نسخة SQLite كاملة تشمل الطلاب والتسجيلات والفواتير والإيصالات والموظفين والمستخدمين والإعدادات وسجل التدقيق."', '              ? "يتم حفظ نسخة مشفرة AES-256-GCM تشمل كل البيانات. اختر كلمة مرور قوية واحتفظ بها في مكان آمن؛ يمكن نقل النسخة المشفرة إلى جهاز جديد واستعادتها بنفس كلمة المرور."')
          replace("src/routes/backup.tsx", '            ? "نسخة Windows تحفظ البيانات في SQLite داخل مجلد بيانات المستخدم، وليس داخل مجلد التثبيت. التحديثات لا تمسح البيانات أو الترخيص، ويُنشئ البرنامج نسخة تلقائية يومية مع الاحتفاظ بآخر 30 نسخة."', '            ? "نسخة Windows تحفظ قاعدة العمل داخل مجلد بيانات المستخدم وليس مجلد التثبيت. النسخ التلقائية اليومية مشفرة بمفتاح محمي من Windows، والنسخ اليدوية المحمولة مشفرة بكلمة المرور التي تختارها. احتفظ بآخر نسخة يدوية خارج الكمبيوتر أيضًا."')

          # Help guide must move with the feature.
          help_file = Path("src/components/HelpGuide.tsx")
          help_text = help_file.read_text()
          help_text = help_text.replace("أنشئ نسخة بعد كل يوم عمل مهم، واحفظ نسخة أسبوعية على USB أو قرص آخر.", "أنشئ نسخة بعد كل يوم عمل مهم. في Windows اختر كلمة مرور قوية للنسخة المشفرة، ثم احفظ نسخة أسبوعية على USB أو قرص آخر.")
          help_text = help_text.replace("يمكن استعادة البيانات إذا تعطل الجهاز أو حُذفت ملفات بالخطأ.", "يمكن استعادة البيانات على نفس الجهاز أو جهاز جديد باستخدام ملف النسخة وكلمة المرور الخاصة به.")
          help_text = help_text.replace("على بيانات تجريبية فقط، أنشئ نسخة ثم استعدها وتأكد من رجوع الطلاب والسندات والإعدادات.", "على بيانات تجريبية فقط، أنشئ نسخة مشفرة بكلمة مرور ثم استعدها وتأكد من رجوع الطلاب والسندات والإعدادات. جرّب أيضًا أن كلمة مرور خاطئة لا تفتح النسخة.")
          help_file.write_text(help_text)

          Path("tests/backup-crypto-harness.mjs").write_text(r'''import assert from "node:assert/strict";
          import { mkdtemp, readFile, rm, writeFile } from "node:fs/promises";
          import os from "node:os";
          import path from "node:path";
          import { randomBytes } from "node:crypto";
          import { decryptDeviceBackup, decryptPortableBackup, encryptedBackupKind, encryptDeviceBackup, encryptPortableBackup } from "../desktop/backup-crypto.mjs";

          const dir = await mkdtemp(path.join(os.tmpdir(), "academy-backup-crypto-"));
          try {
            const source = path.join(dir, "source.sqlite");
            const portable = path.join(dir, "portable.ahbackup");
            const device = path.join(dir, "device.ahbackup");
            const restored = path.join(dir, "restored.sqlite");
            const original = Buffer.concat([Buffer.from("SQLite format 3\\0"), randomBytes(8192)]);
            await writeFile(source, original);

            await encryptPortableBackup(source, portable, "Correct-Password-123");
            assert.equal(await encryptedBackupKind(portable), "portable");
            assert.equal((await readFile(portable)).includes(Buffer.from("SQLite format 3\\0")), false);
            await decryptPortableBackup(portable, restored, "Correct-Password-123");
            assert.deepEqual(await readFile(restored), original);
            await assert.rejects(() => decryptPortableBackup(portable, restored, "Wrong-Password-123"), /تعذر فك النسخة/);

            const key = randomBytes(32);
            await encryptDeviceBackup(source, device, key);
            assert.equal(await encryptedBackupKind(device), "device");
            await decryptDeviceBackup(device, restored, key);
            assert.deepEqual(await readFile(restored), original);
            await assert.rejects(() => decryptDeviceBackup(device, restored, randomBytes(32)), /تعذر فك النسخة/);
            assert.equal(await encryptedBackupKind(source), "plain");
            console.log("backup-crypto-harness: OK");
          } finally {
            await rm(dir, { recursive: true, force: true });
          }
          ''')

          package = Path("package.json")
          data = json.loads(package.read_text())
          data["scripts"]["test:desktop"] = "node --check desktop/main.mjs && node --check desktop/preload.cjs && node tests/backup-crypto-harness.mjs && node tests/desktop-harness.mjs"
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
