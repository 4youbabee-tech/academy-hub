name: Payroll print UX hotfix

on:
  push:
    branches:
      - academy-v1.1.1-payroll-print-ux

permissions:
  contents: write

concurrency:
  group: payroll-print-ux-hotfix
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: academy-v1.1.1-payroll-print-ux
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply payroll print UX hotfix
        run: python3 scripts/fix-payroll-print-ux.py

      - name: Verify source
        run: npm run ci:verify

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No hotfix changes to commit"
            exit 0
          fi
          git commit -m "fix(payroll): numeric month selector and visible receipt printing"
          git push origin HEAD:academy-v1.1.1-payroll-print-ux
