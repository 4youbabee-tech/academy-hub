name: Apply automatic backup encryption

on:
  push:
    branches:
      - academy-v1.1.1-auto-backup-encryption

permissions:
  contents: write

jobs:
  verify-and-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: academy-v1.1.1-auto-backup-encryption
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply source changes
        run: python3 scripts/apply-auto-backup-encryption.py

      - name: Install exact dependencies
        run: npm ci

      - name: Run full quality gate
        run: npm run ci:verify

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified result
        run: |
          rm .github/workflows/apply-auto-backup-encryption.yml
          rm scripts/apply-auto-backup-encryption.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(backup): encrypt automatic desktop backups"
          git push origin HEAD:academy-v1.1.1-auto-backup-encryption
