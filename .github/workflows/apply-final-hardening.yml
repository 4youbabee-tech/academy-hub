name: Apply final Academy hardening

on:
  push:
    branches:
      - academy-v1.1.0-upgrade
    paths:
      - ".upgrade-patches/**"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: academy-v1.1.0-upgrade
          fetch-depth: 1
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply hardening transform
        shell: bash
        run: |
          shopt -s nullglob
          scripts=(.upgrade-patches/*.mjs)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No hardening scripts found."
            exit 0
          fi
          for script in "${scripts[@]}"; do
            echo "Running $script"
            node "$script"
          done
          rm -f .upgrade-patches/*.mjs
      - name: Install exact dependencies
        run: npm ci
      - name: Verify hardened source
        run: npm run ci:verify
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified hardening
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(finance): harden restore invariants and month rollback"
          git push origin HEAD:academy-v1.1.0-upgrade
