name: Final hardening connect

on:
  push:
    branches: [academy-v1.1.1-final-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: academy-v1.1.1-final-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Connect protected backup service and database indexes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing block in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Database: add safe composite indexes only after migrations have created entities.
          replace("desktop/database.mjs",
                  "    this.runMigrations(currentVersion);\n  }",
                  "    this.runMigrations(currentVersion);\n    this.ensurePerformanceIndexes();\n  }")
          replace("desktop/database.mjs",
                  "\n  getMeta(key) {",
                  '''
  ensurePerformanceIndexes() {
    this.db.exec(`
      CREATE INDEX IF NOT EXISTS idx_entities_student_date
        ON entities(collection, student_id, date_key);
      CREATE INDEX IF NOT EXISTS idx_entities_employee_date
        ON entities(collection, employee_id, date_key);
      CREATE INDEX IF NOT EXISTS idx_entities_collection_void_date
        ON entities(collection, is_void, date_key);
    `);
  }

  getMeta(key) {''')

          # Main process: validate again on the trusted side and wire protected backup service.
          replace("desktop/main.mjs",
                  'import { randomUUID } from "node:crypto";',
                  'import { randomBytes, randomUUID } from "node:crypto";')
          replace("desktop/main.mjs",
                  'import { unlink, writeFile } from "node:fs/promises";',
                  'import { mkdir, readFile, unlink, writeFile } from "node:fs/promises";')
          replace("desktop/main.mjs",
                  'import { AcademyDatabase } from "./database.mjs";',
                  'import { AcademyDatabase, ACADEMY_COLLECTIONS } from "./database.mjs";\nimport { ProtectedBackupService } from "./protected-backup.mjs";')
          replace("desktop/main.mjs",
                  'let database = null;\nlet licenseManager = null;',
                  'let database = null;\nlet protectedBackupService = null;\nlet licenseManager = null;')

          helpers = r'''
async function loadOrCreateAutomaticBackupPassphrase(userData) {
  const securityDirectory = path.join(userData, "security");
  const keyPath = path.join(securityDirectory, "backup-passphrase.bin");
  await mkdir(securityDirectory, { recursive: true });
  if (!safeStorage.isEncryptionAvailable()) {
    if (app.isPackaged) throw new Error("Windows Secure Storage غير متاح؛ لا يمكن حماية النسخ التلقائية بأمان.");
    return null;
  }

  try {
    const protectedValue = await readFile(keyPath);
    const value = safeStorage.decryptString(protectedValue);
    if (value.length < 20) throw new Error("مفتاح حماية النسخ التلقائية غير صالح.");
    return value;
  } catch (error) {
    if (error?.code !== "ENOENT") throw error;
  }

  const value = randomBytes(32).toString("base64url");
  await writeFile(keyPath, safeStorage.encryptString(value), { mode: 0o600 });
  return value;
}

function validateSnapshotPayload(snapshot) {
  if (!snapshot || typeof snapshot !== "object" || Array.isArray(snapshot)) {
    throw new Error("صيغة قاعدة البيانات غير صالحة.");
  }
  if (!Number.isInteger(snapshot.schema_version) || snapshot.schema_version < 1 || snapshot.schema_version > 4) {
    throw new Error("إصدار قاعدة البيانات غير صالح.");
  }
  if (!snapshot.settings || typeof snapshot.settings !== "object" || Array.isArray(snapshot.settings)) {
    throw new Error("إعدادات قاعدة البيانات غير صالحة.");
  }
  for (const collection of ACADEMY_COLLECTIONS) {
    if (!Array.isArray(snapshot[collection])) {
      throw new Error(`مجموعة قاعدة البيانات غير صالحة: ${collection}`);
    }
  }
}

function validateBackupPassphrase(value) {
  if (typeof value !== "string" || value.normalize("NFKC").length < 10 || Buffer.byteLength(value, "utf8") > 1024) {
    throw new Error("كلمة حماية النسخة الاحتياطية يجب أن تكون 10 أحرف على الأقل.");
  }
  return value.normalize("NFKC");
}

'''
          replace("desktop/main.mjs", '\nfunction reserveLoopbackPort() {', '\n' + helpers + 'function reserveLoopbackPort() {')
          replace("desktop/main.mjs",
                  '  handle("academy:database:save", (snapshot) => {\n    requireDatabaseAccess();\n    const payloadSize = Buffer.byteLength(JSON.stringify(snapshot), "utf8");',
                  '  handle("academy:database:save", (snapshot) => {\n    requireDatabaseAccess();\n    validateSnapshotPayload(snapshot);\n    const payloadSize = Buffer.byteLength(JSON.stringify(snapshot), "utf8");')

          old_create = '''  handle("academy:backup:create", async () => {
    requireDatabaseAccess();
    const stamp = new Date().toISOString().replace(/[:.]/g, "-");
    const result = await dialog.showSaveDialog(mainWindow, {
      title: "حفظ نسخة احتياطية",
      defaultPath: path.join(app.getPath("documents"), `Academy-Hub-Backup-${stamp}.sqlite`),
      filters: [{ name: "Academy Hub SQLite Backup", extensions: ["sqlite"] }],
    });
    if (result.canceled || !result.filePath) return { cancelled: true };
    await database.createBackup(result.filePath);
    return { cancelled: false, path: result.filePath };
  });'''
          new_create = '''  handle("academy:backup:create", async ({ passphrase } = {}) => {
    requireDatabaseAccess();
    const password = validateBackupPassphrase(passphrase);
    const stamp = new Date().toISOString().replace(/[:.]/g, "-");
    const result = await dialog.showSaveDialog(mainWindow, {
      title: "حفظ نسخة احتياطية مشفرة",
      defaultPath: path.join(app.getPath("documents"), `Academy-Hub-Backup-${stamp}.ahbackup`),
      filters: [{ name: "Academy Hub Encrypted Backup", extensions: ["ahbackup"] }],
    });
    if (result.canceled || !result.filePath) return { cancelled: true };
    await protectedBackupService.create(result.filePath, password);
    return { cancelled: false, path: result.filePath };
  });'''
          replace("desktop/main.mjs", old_create, new_create)

          old_restore = '''  handle("academy:backup:restore", async () => {
    requireDatabaseAccess();
    const result = await dialog.showOpenDialog(mainWindow, {
      title: "استعادة نسخة احتياطية",
      properties: ["openFile"],
      filters: [{ name: "Academy Hub SQLite Backup", extensions: ["sqlite", "db"] }],
    });
    if (result.canceled || !result.filePaths[0]) return { cancelled: true };
    restoring = true;
    try {
      const safetyBackup = await database.restoreFrom(result.filePaths[0]);
      setTimeout(() => {
        app.relaunch();
        app.exit(0);
      }, 500);
      return { cancelled: false, restarting: true, safetyBackup };
    } catch (error) {
      restoring = false;
      throw error;
    }
  });'''
          new_restore = '''  handle("academy:backup:restore", async ({ passphrase } = {}) => {
    requireDatabaseAccess();
    const password = validateBackupPassphrase(passphrase);
    const result = await dialog.showOpenDialog(mainWindow, {
      title: "استعادة نسخة احتياطية",
      properties: ["openFile"],
      filters: [{ name: "Academy Hub Backup", extensions: ["ahbackup", "sqlite", "db"] }],
    });
    if (result.canceled || !result.filePaths[0]) return { cancelled: true };
    restoring = true;
    try {
      const safetyBackup = await protectedBackupService.restore(result.filePaths[0], password);
      setTimeout(() => {
        app.relaunch();
        app.exit(0);
      }, 500);
      return { cancelled: false, restarting: true, safetyBackup };
    } catch (error) {
      restoring = false;
      throw error;
    }
  });'''
          replace("desktop/main.mjs", old_restore, new_restore)

          replace("desktop/main.mjs",
                  '  const backupDirectory = path.join(userData, "backups");\n  database = await AcademyDatabase.open({ databasePath, backupDirectory });',
                  '  const backupDirectory = path.join(userData, "backups");\n  database = await AcademyDatabase.open({ databasePath, backupDirectory });\n  const automaticPassphrase = await loadOrCreateAutomaticBackupPassphrase(userData);\n  protectedBackupService = new ProtectedBackupService({ database, backupDirectory, automaticPassphrase });')
          replace("desktop/main.mjs",
                  '    void database.createAutomaticBackupIfDue().catch((error) => log("Automatic backup failed", error));',
                  '    void protectedBackupService.createAutomaticIfDue().catch((error) => log("Automatic backup failed", error));')
          replace("desktop/main.mjs",
                  '    database = null;\n  }',
                  '    database = null;\n    protectedBackupService = null;\n  }')

          # Integration harness for portable backup service + legacy restore path.
          Path("tests/protected-backup-harness.mjs").write_text(r'''import assert from "node:assert/strict";
import { mkdtemp, readFile, rm } from "node:fs/promises";
import os from "node:os";
import path from "node:path";
import { AcademyDatabase } from "../desktop/database.mjs";
import { ProtectedBackupService } from "../desktop/protected-backup.mjs";

const now = new Date().toISOString();
const dir = await mkdtemp(path.join(os.tmpdir(), "academy-protected-backup-"));
const databasePath = path.join(dir, "source.sqlite");
const backupDirectory = path.join(dir, "backups");
const encryptedPath = path.join(dir, "portable.ahbackup");
let db;
try {
  db = await AcademyDatabase.open({ databasePath, backupDirectory });
  db.saveSnapshot({
    schema_version: 4,
    settings: { institute_name: "Test", currency: "USD" },
    expense_categories: [],
    users: [{ id: "owner", created_at: now, updated_at: now, branch_id: "b", sync_status: "local", username: "owner", full_name: "Owner", password_hash: "x", role: "owner", is_active: true }],
    students: [], courses: [], classes: [], enrollments: [], invoices: [], installments: [], payments: [], employees: [], payroll_items: [], payroll_payments: [], advances: [], expenses: [], incomes: [], audit_log: [],
  });
  const service = new ProtectedBackupService({ database: db, backupDirectory, automaticPassphrase: "automatic-device-secret-123456789" });
  await service.create(encryptedPath, "Portable-Password-123");
  const bytes = await readFile(encryptedPath);
  assert.equal(bytes.includes(Buffer.from("SQLite format 3\0")), false);
  await assert.rejects(() => service.restore(encryptedPath, "Wrong-Password-123"), /تعذر فك النسخة/);
  await service.restore(encryptedPath, "Portable-Password-123");
  assert.equal(db.loadSnapshot().users[0].username, "owner");
  db.setMeta("last_auto_backup_at", null);
  const automatic = await service.createAutomaticIfDue();
  assert.ok(automatic?.endsWith(".ahbackup"));
  assert.equal((await readFile(automatic)).includes(Buffer.from("SQLite format 3\0")), false);
  console.log("protected-backup-harness: OK");
} finally {
  try { db?.close(); } catch {}
  await rm(dir, { recursive: true, force: true });
}
''')

          pkg = Path("package.json")
          data = json.loads(pkg.read_text())
          desktop = data["scripts"]["test:desktop"]
          if "protected-backup-harness.mjs" not in desktop:
              data["scripts"]["test:desktop"] = desktop.replace("node tests/desktop-harness.mjs", "node tests/protected-backup-harness.mjs && node tests/desktop-harness.mjs")
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Install exact dependencies
        run: npm ci
      - name: Full quality gate
        run: npm run ci:verify
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Commit verified hardening only
        shell: bash
        run: |
          rm .github/workflows/final-hardening-connect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(hardening): connect encrypted backups and desktop safeguards"
          git push origin HEAD:academy-v1.1.1-final-hardening
