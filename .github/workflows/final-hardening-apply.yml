name: Apply final hardening

on:
  push:
    branches: [academy-v1.1.1-final-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: academy-v1.1.1-final-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply source hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Fix nested student routing at the route itself and remove the global click interception workaround.
          replace("src/routes/students.tsx",
                  'import { createFileRoute, Link } from "@tanstack/react-router";',
                  'import { createFileRoute, Link, Outlet, useRouterState } from "@tanstack/react-router";')
          replace("src/routes/students.tsx", '  component: StudentsPage,', '  component: StudentsRoutePage,')
          replace("src/routes/students.tsx", 'const EMPTY = {', '''function StudentsRoutePage() {
            const pathname = useRouterState({ select: (state) => state.location.pathname });
            if (/^\\/students\\/[^/]+\\/?$/.test(pathname)) return <Outlet />;
            return <StudentsPage />;
          }

          const EMPTY = {''')

          replace("src/components/AppShell.tsx",
                  'import { useEffect, useMemo, useState, type ReactNode } from "react";',
                  'import { useMemo, useState, type ReactNode } from "react";')
          replace("src/components/AppShell.tsx", 'import { StudentCardModal } from "@/components/StudentCardModal";\n', '')
          replace("src/components/AppShell.tsx", '  const [studentCardId, setStudentCardId] = useState<string | null>(null);\n', '')
          app_shell = Path("src/components/AppShell.tsx")
          text = app_shell.read_text()
          start = text.index('  useEffect(() => {\n    const openStudentCard')
          end = text.index('\n\n  if (!db)', start)
          text = text[:start] + text[end+2:]
          text = text.replace('      <StudentCardModal studentId={studentCardId} open={!!studentCardId} onClose={() => setStudentCardId(null)} />\n', '')
          app_shell.write_text(text)

          # Encrypted backup helper (AES-256-GCM). Legacy SQLite backups remain importable.
          Path("desktop/backup-crypto.mjs").write_text(r'''import { createCipheriv, createDecipheriv, randomBytes } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";

          const MAGIC = Buffer.from("AHBK1", "ascii");
          const IV_BYTES = 12;
          const TAG_BYTES = 16;

          function assertKey(key) {
            if (!Buffer.isBuffer(key) || key.length !== 32) throw new Error("Invalid Academy Hub backup encryption key.");
          }

          export async function isEncryptedBackup(filePath) {
            const data = await readFile(filePath);
            return data.length > MAGIC.length && data.subarray(0, MAGIC.length).equals(MAGIC);
          }

          export async function encryptBackupFile(source, destination, key) {
            assertKey(key);
            const plain = await readFile(source);
            const iv = randomBytes(IV_BYTES);
            const cipher = createCipheriv("aes-256-gcm", key, iv);
            const encrypted = Buffer.concat([cipher.update(plain), cipher.final()]);
            const tag = cipher.getAuthTag();
            await writeFile(destination, Buffer.concat([MAGIC, iv, tag, encrypted]));
          }

          export async function decryptBackupFile(source, destination, key) {
            assertKey(key);
            const payload = await readFile(source);
            if (!payload.subarray(0, MAGIC.length).equals(MAGIC)) throw new Error("النسخة الاحتياطية ليست بصيغة Academy Hub المشفرة.");
            if (payload.length <= MAGIC.length + IV_BYTES + TAG_BYTES) throw new Error("النسخة الاحتياطية المشفرة تالفة.");
            const ivStart = MAGIC.length;
            const tagStart = ivStart + IV_BYTES;
            const bodyStart = tagStart + TAG_BYTES;
            const iv = payload.subarray(ivStart, tagStart);
            const tag = payload.subarray(tagStart, bodyStart);
            const encrypted = payload.subarray(bodyStart);
            try {
              const decipher = createDecipheriv("aes-256-gcm", key, iv);
              decipher.setAuthTag(tag);
              const plain = Buffer.concat([decipher.update(encrypted), decipher.final()]);
              await writeFile(destination, plain);
            } catch {
              throw new Error("تعذر فك النسخة الاحتياطية: الملف تالف أو مفتاح الحماية غير صحيح.");
            }
          }
          ''')

          # Wire encrypted backups into the SQLite repository.
          replace("desktop/database.mjs",
                  'import { backup as sqliteBackup, DatabaseSync } from "node:sqlite";\nimport { mkdir, copyFile, readdir, rm, stat } from "node:fs/promises";\nimport path from "node:path";',
                  'import { backup as sqliteBackup, DatabaseSync } from "node:sqlite";\nimport { randomUUID } from "node:crypto";\nimport { mkdir, copyFile, readdir, rm, stat } from "node:fs/promises";\nimport path from "node:path";\nimport { decryptBackupFile, encryptBackupFile, isEncryptedBackup } from "./backup-crypto.mjs";')
          replace("desktop/database.mjs",
                  '  static async open({ databasePath, backupDirectory }) {',
                  '  static async open({ databasePath, backupDirectory, backupKey = null }) {')
          replace("desktop/database.mjs",
                  '    const instance = new AcademyDatabase(databasePath, backupDirectory);',
                  '    const instance = new AcademyDatabase(databasePath, backupDirectory, backupKey);')
          replace("desktop/database.mjs",
                  '  constructor(databasePath, backupDirectory) {\n    this.databasePath = databasePath;\n    this.backupDirectory = backupDirectory;\n    this.db = new DatabaseSync(databasePath);\n  }',
                  '  constructor(databasePath, backupDirectory, backupKey = null) {\n    this.databasePath = databasePath;\n    this.backupDirectory = backupDirectory;\n    this.backupKey = Buffer.isBuffer(backupKey) && backupKey.length === 32 ? backupKey : null;\n    this.db = new DatabaseSync(databasePath);\n  }')
          replace("desktop/database.mjs",
                  '''  async createBackup(destination) {
            await mkdir(path.dirname(destination), { recursive: true });
            await rm(destination, { force: true });
            await sqliteBackup(this.db, destination);
            return destination;
          }''',
                  '''  async createBackup(destination) {
            await mkdir(path.dirname(destination), { recursive: true });
            await rm(destination, { force: true });
            if (!this.backupKey) {
              await sqliteBackup(this.db, destination);
              return destination;
            }
            const temporary = `${destination}.plain-${randomUUID()}.sqlite`;
            try {
              await sqliteBackup(this.db, temporary);
              await encryptBackupFile(temporary, destination, this.backupKey);
            } finally {
              await rm(temporary, { force: true });
            }
            return destination;
          }

          async materializeBackup(source) {
            if (!(await isEncryptedBackup(source))) return { path: source, temporary: false };
            if (!this.backupKey) throw new Error("لا يتوفر مفتاح حماية النسخ الاحتياطية على هذا الجهاز.");
            const temporary = path.join(this.backupDirectory, `.academy-hub-decrypted-${randomUUID()}.sqlite`);
            await decryptBackupFile(source, temporary, this.backupKey);
            return { path: temporary, temporary: true };
          }''')
          replace("desktop/database.mjs", '`academy-hub-auto-${localFileTimestamp()}.sqlite`,', '`academy-hub-auto-${localFileTimestamp()}.ahbackup`,')
          replace("desktop/database.mjs", '/^academy-hub-auto-.*\\.sqlite$/i.test(entry.name)', '/^academy-hub-auto-.*\\.(?:ahbackup|sqlite)$/i.test(entry.name)')
          replace("desktop/database.mjs",
                  '  async validateBackup(source) {\n    const info = await stat(source);\n    if (!info.isFile() || info.size < 512) throw new Error("ملف النسخة الاحتياطية غير صالح.");\n    const candidate = new DatabaseSync(source, { readOnly: true });',
                  '  async validateBackup(source, { plaintext = false } = {}) {\n    const materialized = plaintext ? { path: source, temporary: false } : await this.materializeBackup(source);\n    const candidatePath = materialized.path;\n    const info = await stat(candidatePath);\n    if (!info.isFile() || info.size < 512) {\n      if (materialized.temporary) await rm(candidatePath, { force: true });\n      throw new Error("ملف النسخة الاحتياطية غير صالح.");\n    }\n    const candidate = new DatabaseSync(candidatePath, { readOnly: true });')
          replace("desktop/database.mjs",
                  '    } finally {\n      candidate.close();\n    }\n  }\n\n  async restoreFrom(source) {\n    await this.validateBackup(source);',
                  '    } finally {\n      candidate.close();\n      if (materialized.temporary) await rm(candidatePath, { force: true });\n    }\n  }\n\n  async restoreFrom(source) {\n    const materialized = await this.materializeBackup(source);\n    await this.validateBackup(materialized.path, { plaintext: true });')
          replace("desktop/database.mjs",
                  '      await copyFile(source, this.databasePath);',
                  '      await copyFile(materialized.path, this.databasePath);')
          replace("desktop/database.mjs",
                  '      await copyFile(safetyBackup, this.databasePath);\n      this.db = new DatabaseSync(this.databasePath);\n      await this.initialize();\n      throw error;\n    }\n\n    return safetyBackup;',
                  '      const safetyMaterialized = await this.materializeBackup(safetyBackup);\n      try {\n        await copyFile(safetyMaterialized.path, this.databasePath);\n      } finally {\n        if (safetyMaterialized.temporary) await rm(safetyMaterialized.path, { force: true });\n      }\n      this.db = new DatabaseSync(this.databasePath);\n      await this.initialize();\n      throw error;\n    } finally {\n      if (materialized.temporary) await rm(materialized.path, { force: true });\n    }\n\n    return safetyBackup;')

          # Add useful composite indexes for large historical datasets. Safe on existing databases.
          replace("desktop/database.mjs",
                  '      PRAGMA temp_store = MEMORY;\n    `);',
                  '      PRAGMA temp_store = MEMORY;\n      CREATE INDEX IF NOT EXISTS idx_entities_student_date ON entities(collection, student_id, date_key);\n      CREATE INDEX IF NOT EXISTS idx_entities_employee_date ON entities(collection, employee_id, date_key);\n      CREATE INDEX IF NOT EXISTS idx_entities_collection_void_date ON entities(collection, is_void, date_key);\n    `);')

          # Protect the backup key with Electron safeStorage / Windows DPAPI when packaged.
          replace("desktop/main.mjs", 'import { randomUUID } from "node:crypto";', 'import { randomBytes, randomUUID } from "node:crypto";')
          replace("desktop/main.mjs", 'import { unlink, writeFile } from "node:fs/promises";', 'import { mkdir, readFile, unlink, writeFile } from "node:fs/promises";')
          marker = 'function reserveLoopbackPort() {'
          key_fn = r'''async function loadOrCreateBackupKey(userData) {
            const securityDirectory = path.join(userData, "security");
            const keyPath = path.join(securityDirectory, "backup-key.bin");
            await mkdir(securityDirectory, { recursive: true });
            if (!safeStorage.isEncryptionAvailable()) {
              if (app.isPackaged) throw new Error("Windows secure storage is unavailable; encrypted backups cannot be enabled safely.");
              log("Secure storage unavailable in development; backup encryption is disabled.");
              return null;
            }
            try {
              const protectedKey = await readFile(keyPath);
              const decoded = Buffer.from(safeStorage.decryptString(protectedKey), "base64");
              if (decoded.length !== 32) throw new Error("Invalid protected backup key.");
              return decoded;
            } catch (error) {
              if (error?.code !== "ENOENT") throw error;
            }
            const key = randomBytes(32);
            await writeFile(keyPath, safeStorage.encryptString(key.toString("base64")), { mode: 0o600 });
            return key;
          }

          '''
          replace("desktop/main.mjs", marker, key_fn + marker)
          replace("desktop/main.mjs",
                  '  const backupDirectory = path.join(userData, "backups");\n  database = await AcademyDatabase.open({ databasePath, backupDirectory });',
                  '  const backupDirectory = path.join(userData, "backups");\n  const backupKey = await loadOrCreateBackupKey(userData);\n  database = await AcademyDatabase.open({ databasePath, backupDirectory, backupKey });')
          replace("desktop/main.mjs", '`Academy-Hub-Backup-${stamp}.sqlite`', '`Academy-Hub-Backup-${stamp}.ahbackup`')
          replace("desktop/main.mjs", 'filters: [{ name: "Academy Hub SQLite Backup", extensions: ["sqlite"] }],', 'filters: [{ name: "Academy Hub Encrypted Backup", extensions: ["ahbackup"] }],')
          replace("desktop/main.mjs", 'filters: [{ name: "Academy Hub SQLite Backup", extensions: ["sqlite", "db"] }],', 'filters: [{ name: "Academy Hub Backup", extensions: ["ahbackup", "sqlite", "db"] }],')

          # Backup crypto tests are dependency-free and run inside the existing desktop quality gate.
          Path("tests/backup-crypto-harness.mjs").write_text(r'''import assert from "node:assert/strict";
          import { mkdtemp, readFile, rm, writeFile } from "node:fs/promises";
          import os from "node:os";
          import path from "node:path";
          import { randomBytes } from "node:crypto";
          import { decryptBackupFile, encryptBackupFile, isEncryptedBackup } from "../desktop/backup-crypto.mjs";

          const dir = await mkdtemp(path.join(os.tmpdir(), "academy-backup-crypto-"));
          try {
            const source = path.join(dir, "source.sqlite");
            const encrypted = path.join(dir, "backup.ahbackup");
            const restored = path.join(dir, "restored.sqlite");
            const original = Buffer.concat([Buffer.from("SQLite format 3\\0"), randomBytes(4096)]);
            const key = randomBytes(32);
            await writeFile(source, original);
            await encryptBackupFile(source, encrypted, key);
            assert.equal(await isEncryptedBackup(encrypted), true);
            assert.equal((await readFile(encrypted)).includes(Buffer.from("SQLite format 3\\0")), false);
            await decryptBackupFile(encrypted, restored, key);
            assert.deepEqual(await readFile(restored), original);
            await assert.rejects(() => decryptBackupFile(encrypted, restored, randomBytes(32)), /تعذر فك النسخة/);
            console.log("Backup crypto harness passed.");
          } finally {
            await rm(dir, { recursive: true, force: true });
          }
          ''')

          package = Path("package.json")
          data = json.loads(package.read_text())
          data["scripts"]["test:desktop"] = "node --check desktop/main.mjs && node --check desktop/preload.cjs && node tests/backup-crypto-harness.mjs && node tests/desktop-harness.mjs"
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run full quality gate
        run: npm run ci:verify
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/final-hardening-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(hardening): secure backups, routes and large-data indexes"
          git push origin HEAD:academy-v1.1.1-final-hardening
