name: Academy v1.1.1 final polish

on:
  push:
    branches:
      - academy-v1.1.1-usability-finance

permissions:
  contents: write

concurrency:
  group: academy-v1.1.1-final-polish
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: academy-v1.1.1-usability-finance
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply final terminology and payroll filters
        run: node scripts/final-v1.1.1-polish.mjs

      - name: Verify source
        run: npm run ci:verify

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No final polish changes to commit"
            exit 0
          fi
          git commit -m "polish(v1.1.1): finalize terminology and payroll filtering"
          git push origin HEAD:academy-v1.1.1-usability-finance
