name: Academy v1.1.1 staged verification

on:
  push:
    branches:
      - academy-v1.1.1-usability-finance

permissions:
  contents: read

concurrency:
  group: academy-v1.1.1-staged
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify source
        run: npm run ci:verify

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
