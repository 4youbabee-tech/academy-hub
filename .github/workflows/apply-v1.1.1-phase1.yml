name: Apply Academy v1.1.1 phase 1

on:
  push:
    branches:
      - academy-v1.1.1-usability-finance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: academy-v1.1.1-usability-finance
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply phase 1 transformations
        run: node scripts/apply-v1.1.1-phase1.mjs

      - name: Verify source
        run: npm run ci:verify

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(v1.1.1): simplify academic workflow and owner audit access"
          git push origin HEAD:academy-v1.1.1-usability-finance
