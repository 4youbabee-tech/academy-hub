name: Wire encrypted backups into SQLite

on:
  push:
    branches: [academy-v1.1.1-final-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: academy-v1.1.1-final-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Wire encryption, backup UI, indexes and main-process validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          def sub(path, pattern, repl, count=1, flags=0):
              p=Path(path); t=p.read_text()
              n=re.subn(pattern,repl,t,count=count,flags=flags)
              if n[1] != count:
                  raise SystemExit(f"replace failed {path}: {pattern[:100]} count={n[1]}")
              p.write_text(n[0])

          # database.mjs: reuse the already-tested AHBK2 crypto envelope.
          p=Path('desktop/database.mjs'); t=p.read_text()
          t=t.replace('import { mkdir, copyFile, readdir, rm, stat } from "node:fs/promises";\nimport path from "node:path";',
                      'import { randomUUID } from "node:crypto";\nimport { mkdir, copyFile, readdir, rm, stat } from "node:fs/promises";\nimport path from "node:path";\nimport { decryptBackupFile, encryptBackupFile, isEncryptedBackup } from "./backup-crypto.mjs";')
          t=t.replace('static async open({ databasePath, backupDirectory }) {','static async open({ databasePath, backupDirectory, automaticBackupPassphrase = null }) {')
          t=t.replace('const instance = new AcademyDatabase(databasePath, backupDirectory);','const instance = new AcademyDatabase(databasePath, backupDirectory, automaticBackupPassphrase);')
          t=t.replace('constructor(databasePath, backupDirectory) {\n    this.databasePath = databasePath;\n    this.backupDirectory = backupDirectory;\n    this.db = new DatabaseSync(databasePath);\n  }',
                      'constructor(databasePath, backupDirectory, automaticBackupPassphrase = null) {\n    this.databasePath = databasePath;\n    this.backupDirectory = backupDirectory;\n    this.automaticBackupPassphrase = typeof automaticBackupPassphrase === "string" ? automaticBackupPassphrase : null;\n    this.db = new DatabaseSync(databasePath);\n  }')
          t=t.replace('    this.runMigrations(currentVersion);\n  }','    this.runMigrations(currentVersion);\n    this.ensurePerformanceIndexes();\n  }',1)
          insert='''\n  ensurePerformanceIndexes() {\n    this.db.exec(`\n      CREATE INDEX IF NOT EXISTS idx_entities_student_date ON entities(collection, student_id, date_key);\n      CREATE INDEX IF NOT EXISTS idx_entities_employee_date ON entities(collection, employee_id, date_key);\n      CREATE INDEX IF NOT EXISTS idx_entities_collection_void_date ON entities(collection, is_void, date_key);\n    `);\n  }\n'''
          marker='\n  getPage(collection, request = {}) {'
          if marker not in t: raise SystemExit('getPage marker missing')
          t=t.replace(marker,insert+marker,1)

          create_pattern=r'  async createBackup\(destination\) \{.*?\n  \}\n\n  async createAutomaticBackupIfDue\(\) \{'
          create_repl='''  async createBackup(destination, { passphrase = null } = {}) {\n    await mkdir(path.dirname(destination), { recursive: true });\n    await rm(destination, { force: true });\n    if (!passphrase) {\n      await sqliteBackup(this.db, destination);\n      return destination;\n    }\n\n    const temporary = path.join(this.backupDirectory, `.academy-hub-plain-${randomUUID()}.sqlite`);\n    try {\n      await sqliteBackup(this.db, temporary);\n      await encryptBackupFile(temporary, destination, passphrase);\n    } finally {\n      await rm(temporary, { force: true });\n    }\n    return destination;\n  }\n\n  async materializeBackup(source, { passphrase = null } = {}) {\n    if (!(await isEncryptedBackup(source))) return { path: source, temporary: false, encrypted: false };\n    if (!passphrase) throw new Error("هذه النسخة مشفرة. أدخل كلمة حماية النسخة الاحتياطية.");\n    const temporary = path.join(this.backupDirectory, `.academy-hub-decrypted-${randomUUID()}.sqlite`);\n    try {\n      await decryptBackupFile(source, temporary, passphrase);\n      return { path: temporary, temporary: true, encrypted: true };\n    } catch (error) {\n      await rm(temporary, { force: true });\n      throw error;\n    }\n  }\n\n  async createAutomaticBackupIfDue() {'''
          t,n=re.subn(create_pattern,create_repl,t,count=1,flags=re.S)
          if n!=1: raise SystemExit('createBackup block replace failed')
          t=t.replace('`academy-hub-auto-${localFileTimestamp()}.sqlite`,','`academy-hub-auto-${localFileTimestamp()}.${this.automaticBackupPassphrase ? "ahbackup" : "sqlite"}`,',1)
          t=t.replace('await this.createBackup(destination);','await this.createBackup(destination, { passphrase: this.automaticBackupPassphrase });',1)
          t=t.replace('/^academy-hub-auto-.*\\.sqlite$/i.test(entry.name)','/^academy-hub-auto-.*\\.(?:ahbackup|sqlite)$/i.test(entry.name)',1)

          # Turn current validator into plain SQLite validator; add encrypted wrapper.
          t=t.replace('  async validateBackup(source) {','  async validatePlainBackup(source) {',1)
          marker='\n  async restoreFrom(source) {'
          wrapper='''\n  async validateBackup(source, { passphrase = null } = {}) {\n    const materialized = await this.materializeBackup(source, { passphrase });\n    try {\n      await this.validatePlainBackup(materialized.path);\n      return { encrypted: materialized.encrypted };\n    } finally {\n      if (materialized.temporary) await rm(materialized.path, { force: true });\n    }\n  }\n'''
          if marker not in t: raise SystemExit('restore marker missing')
          t=t.replace(marker,wrapper+marker,1)

          restore_pattern=r'  async restoreFrom\(source\) \{.*?\n    return safetyBackup;\n  \}'
          restore_repl='''  async restoreFrom(source, { passphrase = null } = {}) {\n    const materialized = await this.materializeBackup(source, { passphrase });\n    try {\n      await this.validatePlainBackup(materialized.path);\n      const safetyBackup = path.join(\n        this.backupDirectory,\n        `academy-hub-before-restore-${localFileTimestamp()}.${this.automaticBackupPassphrase ? "ahbackup" : "sqlite"}`,\n      );\n      await this.createBackup(safetyBackup, { passphrase: this.automaticBackupPassphrase });\n\n      this.db.exec("PRAGMA wal_checkpoint(TRUNCATE)");\n      this.db.close();\n      await rm(`${this.databasePath}-wal`, { force: true });\n      await rm(`${this.databasePath}-shm`, { force: true });\n\n      try {\n        await copyFile(materialized.path, this.databasePath);\n        this.db = new DatabaseSync(this.databasePath);\n        await this.initialize();\n      } catch (error) {\n        const safetyMaterialized = await this.materializeBackup(safetyBackup, { passphrase: this.automaticBackupPassphrase });\n        try {\n          await copyFile(safetyMaterialized.path, this.databasePath);\n        } finally {\n          if (safetyMaterialized.temporary) await rm(safetyMaterialized.path, { force: true });\n        }\n        this.db = new DatabaseSync(this.databasePath);\n        await this.initialize();\n        throw error;\n      }\n\n      return safetyBackup;\n    } finally {\n      if (materialized.temporary) await rm(materialized.path, { force: true });\n    }\n  }'''
          t,n=re.subn(restore_pattern,restore_repl,t,count=1,flags=re.S)
          if n!=1: raise SystemExit('restoreFrom replace failed')
          t=t.replace('`academy-hub-before-migration-v${currentVersion}-${localFileTimestamp()}.sqlite`,','`academy-hub-before-migration-v${currentVersion}-${localFileTimestamp()}.${this.automaticBackupPassphrase ? "ahbackup" : "sqlite"}`,',1)
          # migration backup should be encrypted too
          migration_call='''      await this.createBackup(path.join(\n        this.backupDirectory,\n        `academy-hub-before-migration-v${currentVersion}-${localFileTimestamp()}.${this.automaticBackupPassphrase ? "ahbackup" : "sqlite"}`,\n      ));'''
          if migration_call in t:
              t=t.replace(migration_call,migration_call[:-3]+', { passphrase: this.automaticBackupPassphrase });',1)
          p.write_text(t)

          # main process: device-protected automatic passphrase + payload schema validation + portable backup password.
          p=Path('desktop/main.mjs'); t=p.read_text()
          t=t.replace('import { randomUUID } from "node:crypto";','import { randomBytes, randomUUID } from "node:crypto";',1)
          t=t.replace('import { unlink, writeFile } from "node:fs/promises";','import { mkdir, readFile, unlink, writeFile } from "node:fs/promises";',1)
          t=t.replace('import { AcademyDatabase } from "./database.mjs";','import { AcademyDatabase, ACADEMY_COLLECTIONS } from "./database.mjs";',1)
          helper='''\nasync function loadOrCreateAutomaticBackupPassphrase(userData) {\n  const securityDirectory = path.join(userData, "security");\n  const keyPath = path.join(securityDirectory, "backup-passphrase.bin");\n  await mkdir(securityDirectory, { recursive: true });\n  if (!safeStorage.isEncryptionAvailable()) {\n    if (app.isPackaged) throw new Error("Windows Secure Storage غير متاح؛ لا يمكن حماية النسخ التلقائية بأمان.");\n    return null;\n  }\n  try {\n    const protectedValue = await readFile(keyPath);\n    const value = safeStorage.decryptString(protectedValue);\n    if (value.length < 20) throw new Error("مفتاح حماية النسخ التلقائية غير صالح.");\n    return value;\n  } catch (error) {\n    if (error?.code !== "ENOENT") throw error;\n  }\n  const value = randomBytes(32).toString("base64url");\n  await writeFile(keyPath, safeStorage.encryptString(value), { mode: 0o600 });\n  return value;\n}\n\nfunction validateSnapshotPayload(snapshot) {\n  if (!snapshot || typeof snapshot !== "object" || Array.isArray(snapshot)) throw new Error("صيغة قاعدة البيانات غير صالحة.");\n  if (!Number.isInteger(snapshot.schema_version) || snapshot.schema_version < 1 || snapshot.schema_version > 4) throw new Error("إصدار قاعدة البيانات غير صالح.");\n  if (!snapshot.settings || typeof snapshot.settings !== "object" || Array.isArray(snapshot.settings)) throw new Error("إعدادات قاعدة البيانات غير صالحة.");\n  for (const collection of ACADEMY_COLLECTIONS) {\n    if (!Array.isArray(snapshot[collection])) throw new Error(`مجموعة قاعدة البيانات غير صالحة: ${collection}`);\n  }\n}\n\nfunction validateBackupPassphrase(value, required = false) {\n  if (value == null || value === "") {\n    if (required) throw new Error("أدخل كلمة حماية النسخة الاحتياطية.");\n    return null;\n  }\n  if (typeof value !== "string" || value.normalize("NFKC").length < 10 || Buffer.byteLength(value, "utf8") > 1024) {\n    throw new Error("كلمة حماية النسخة الاحتياطية يجب أن تكون 10 أحرف على الأقل.");\n  }\n  return value;\n}\n'''
          t=t.replace('\nfunction reserveLoopbackPort() {',helper+'\nfunction reserveLoopbackPort() {',1)
          t=t.replace('    requireDatabaseAccess();\n    const payloadSize = Buffer.byteLength(JSON.stringify(snapshot), "utf8");','    requireDatabaseAccess();\n    validateSnapshotPayload(snapshot);\n    const payloadSize = Buffer.byteLength(JSON.stringify(snapshot), "utf8");',1)
          t=t.replace('handle("academy:backup:create", async () => {','handle("academy:backup:create", async ({ passphrase } = {}) => {',1)
          t=t.replace('    requireDatabaseAccess();\n    const stamp = new Date().toISOString().replace(/[:.]/g, "-");\n    const result = await dialog.showSaveDialog(mainWindow, {\n      title: "حفظ نسخة احتياطية",\n      defaultPath: path.join(app.getPath("documents"), `Academy-Hub-Backup-${stamp}.sqlite`),\n      filters: [{ name: "Academy Hub SQLite Backup", extensions: ["sqlite"] }],',
                      '    requireDatabaseAccess();\n    const portablePassphrase = validateBackupPassphrase(passphrase, true);\n    const stamp = new Date().toISOString().replace(/[:.]/g, "-");\n    const result = await dialog.showSaveDialog(mainWindow, {\n      title: "حفظ نسخة احتياطية مشفرة",\n      defaultPath: path.join(app.getPath("documents"), `Academy-Hub-Backup-${stamp}.ahbackup`),\n      filters: [{ name: "Academy Hub Encrypted Backup", extensions: ["ahbackup"] }],',1)
          t=t.replace('await database.createBackup(result.filePath);','await database.createBackup(result.filePath, { passphrase: portablePassphrase });',1)
          t=t.replace('handle("academy:backup:restore", async () => {','handle("academy:backup:restore", async ({ passphrase } = {}) => {',1)
          t=t.replace('filters: [{ name: "Academy Hub SQLite Backup", extensions: ["sqlite", "db"] }],','filters: [{ name: "Academy Hub Backup", extensions: ["ahbackup", "sqlite", "db"] }],',1)
          t=t.replace('const safetyBackup = await database.restoreFrom(result.filePaths[0]);','const safetyBackup = await database.restoreFrom(result.filePaths[0], { passphrase: validateBackupPassphrase(passphrase) });',1)
          t=t.replace('  database = await AcademyDatabase.open({ databasePath, backupDirectory });','  const automaticBackupPassphrase = await loadOrCreateAutomaticBackupPassphrase(userData);\n  database = await AcademyDatabase.open({ databasePath, backupDirectory, automaticBackupPassphrase });',1)
          p.write_text(t)

          # preload current branch already validates backup payloads; normalize field name to passphrase.
          p=Path('desktop/preload.cjs'); t=p.read_text()
          t=t.replace('password', 'passphrase')
          p.write_text(t)

          # Type declarations align with preload.
          p=Path('src/desktop.d.ts'); t=p.read_text().replace('password', 'passphrase'); p.write_text(t)

          # backup UI.
          p=Path('src/routes/backup.tsx'); t=p.read_text()
          t=t.replace('import { Button, PageHeader, Panel } from "@/components/ui-kit";','import { Button, Field, Input, PageHeader, Panel } from "@/components/ui-kit";',1)
          t=t.replace('  const [restoring, setRestoring] = useState(false);','  const [restoring, setRestoring] = useState(false);\n  const [backupPassphrase, setBackupPassphrase] = useState("");\n  const [backupPassphraseConfirm, setBackupPassphraseConfirm] = useState("");\n  const [restorePassphrase, setRestorePassphrase] = useState("");',1)
          t=t.replace('        const result = await desktopApi.backup.create();','        if (backupPassphrase.normalize("NFKC").length < 10) throw new Error("اختر كلمة حماية للنسخة من 10 أحرف على الأقل.");\n        if (backupPassphrase !== backupPassphraseConfirm) throw new Error("تأكيد كلمة الحماية غير مطابق.");\n        const result = await desktopApi.backup.create({ passphrase: backupPassphrase });',1)
          t=t.replace('"إنشاء نسخة احتياطية SQLite لقاعدة البيانات"','"إنشاء نسخة احتياطية مشفرة محمولة لقاعدة البيانات"',1)
          t=t.replace('const result = await desktopApi.backup.restore();','const result = await desktopApi.backup.restore({ passphrase: restorePassphrase || undefined });',1)
          export_block='''          <div className="mt-5">\n            <Button onClick={exportBackup} disabled={!canExport}>\n              تنزيل نسخة احتياطية\n            </Button>\n          </div>'''
          export_new='''          {desktopApi ? (\n            <div className="mt-4 grid gap-3 sm:grid-cols-2">\n              <Field label="كلمة حماية النسخة المشفرة">\n                <Input type="password" autoComplete="new-password" value={backupPassphrase} onChange={(event) => setBackupPassphrase(event.target.value)} placeholder="10 أحرف على الأقل" />\n              </Field>\n              <Field label="تأكيد كلمة الحماية">\n                <Input type="password" autoComplete="new-password" value={backupPassphraseConfirm} onChange={(event) => setBackupPassphraseConfirm(event.target.value)} />\n              </Field>\n            </div>\n          ) : null}\n          <div className="mt-5">\n            <Button onClick={exportBackup} disabled={!canExport}>\n              تنزيل نسخة احتياطية\n            </Button>\n          </div>'''
          if export_block not in t: raise SystemExit('backup export block missing')
          t=t.replace(export_block,export_new,1)
          restore_block='''          <div className="mt-5">\n            <Button\n              variant="secondary"'''
          restore_new='''          {desktopApi ? (\n            <div className="mt-4">\n              <Field label="كلمة حماية النسخة (تُترك فارغة للنسخ SQLite القديمة فقط)">\n                <Input type="password" autoComplete="current-password" value={restorePassphrase} onChange={(event) => setRestorePassphrase(event.target.value)} />\n              </Field>\n            </div>\n          ) : null}\n          <div className="mt-5">\n            <Button\n              variant="secondary"'''
          if restore_block not in t: raise SystemExit('backup restore block missing')
          t=t.replace(restore_block,restore_new,1)
          t=t.replace('يتم حفظ نسخة SQLite كاملة تشمل الطلاب والتسجيلات والفواتير والإيصالات والموظفين والمستخدمين والإعدادات وسجل التدقيق.','يتم حفظ نسخة مشفرة AES-256-GCM تشمل كل البيانات. احتفظ بكلمة الحماية؛ تستطيع نقل الملف إلى جهاز جديد واستعادته بنفس الكلمة.',1)
          t=t.replace('نسخة Windows تحفظ البيانات في SQLite داخل مجلد بيانات المستخدم، وليس داخل مجلد التثبيت. التحديثات لا تمسح البيانات أو الترخيص، ويُنشئ البرنامج نسخة تلقائية يومية مع الاحتفاظ بآخر 30 نسخة.','نسخة Windows تحفظ قاعدة العمل داخل مجلد بيانات المستخدم. النسخ التلقائية اليومية مشفرة بكلمة عشوائية يحميها Windows Secure Storage، والنسخ اليدوية المحمولة مشفرة بكلمة الحماية التي تختارها. احتفظ بنسخة يدوية خارج الكمبيوتر.',1)
          p.write_text(t)

          # Help Guide follows implementation.
          p=Path('src/components/HelpGuide.tsx'); t=p.read_text()
          t=t.replace('أنشئ نسخة بعد كل يوم عمل مهم، واحفظ نسخة أسبوعية على USB أو قرص آخر.','أنشئ نسخة بعد كل يوم عمل مهم. في Windows اختر كلمة حماية قوية للنسخة المشفرة، واحفظ نسخة أسبوعية على USB أو قرص آخر.',1)
          t=t.replace('يمكن استعادة البيانات إذا تعطل الجهاز أو حُذفت ملفات بالخطأ.','يمكن استعادة البيانات على نفس الجهاز أو جهاز جديد باستخدام ملف النسخة وكلمة الحماية الخاصة به.',1)
          t=t.replace('على بيانات تجريبية فقط، أنشئ نسخة ثم استعدها وتأكد من رجوع الطلاب والسندات والإعدادات.','على بيانات تجريبية فقط، أنشئ نسخة مشفرة ثم استعدها وتأكد من رجوع الطلاب والسندات والإعدادات، وتأكد أن كلمة حماية خاطئة لا تفتحها.',1)
          p.write_text(t)

          # Extend existing crypto harness into actual database backup roundtrip.
          p=Path('tests/backup-crypto-harness.mjs'); t=p.read_text()
          # existing envelope test is already good; no rewrite needed.

          pkg=Path('package.json'); data=json.loads(pkg.read_text())
          if 'backup-crypto-harness.mjs' not in data['scripts']['test:desktop']:
              data['scripts']['test:desktop']='node --check desktop/main.mjs && node --check desktop/preload.cjs && node tests/backup-crypto-harness.mjs && node tests/desktop-harness.mjs'
          pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Install exact dependencies
        run: npm ci
      - name: Run full quality gate
        run: npm run ci:verify
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Commit only verified hardening
        shell: bash
        run: |
          rm -f .github/workflows/final-hardening-secure-backups.yml .github/workflows/final-hardening-wire-backups.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(hardening): wire encrypted backups and database safeguards"
          git push origin HEAD:academy-v1.1.1-final-hardening
